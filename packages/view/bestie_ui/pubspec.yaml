name: bestie_ui
description: Bestie's shared, feature-agnostic UI layer (theme, layout, controls, input, banner, effects, nav) used to compose every feature.
version: 0.0.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  blocterm:
    path: ../../infra/blocterm
  characters: ^1.4.0
  clock: ^1.1.1
  humanizer: ^3.0.1
  intentions: ^0.1.0
  logic_bloc_adapter:
    path: ../../infra/logic_bloc_adapter
  logic_blocks: ^1.0.0
  markdown_highlighted:
    path: ../../infra/markdown_highlighted
  meta: ^1.18.0
  nocterm: ^0.6.0
  terminal_screen:
    path: ../../infra/terminal_screen

dev_dependencies:
  fake_async: ^1.3.2
  mocktail: ^1.0.4
  test: ^1.26.3
  very_good_analysis: ^10.0.0
  vt_parser:
    path: ../../infra/vt_parser
