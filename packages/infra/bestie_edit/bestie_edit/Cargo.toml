[package]
name = "bestie_edit"
version = "0.1.0"
edition = "2021"
description = "Bestie's file editor: one exact-string replacement answered with a snippet and a diff, or one new file, each written atomically."

# Why this exists: the `edit` and `create` tools have to behave identically on macOS, Linux
# and Windows and has to run under the same confinement as the agent shell.
# A tiny native program spawned through the process host gets both for free —
# the sandbox is the only permission model, and Dart never touches the file.

[[bin]]
name = "bestie_edit"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
