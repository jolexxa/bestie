name: local_server
description: >-
  The local inference server's HTTP surface: OpenAI-compatible chat
  completions, the owner session, agent leases, model loading, and the
  singleton lock.
version: 0.0.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  dart_mappable: ^4.3.0
  engine_completions:
    path: ../engine_completions
  engine_protocol:
    path: ../engine_protocol
  engine_templates:
    path: ../engine_templates
  file: ^7.0.1
  local_server_protocol:
    path: ../local_server_protocol
  logic_blocks: ^1.0.0
  path: ^1.9.1
  tool_protocol:
    path: ../tool_protocol

dev_dependencies:
  coverage: ^1.15.0
  fake_async: ^1.3.2
  mocktail: ^1.0.5
  test: ^1.31.1
  very_good_analysis: ^10.2.0
