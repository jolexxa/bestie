name: agent_runtime
description: >-
  An agent runtime that drives the agent loop against a completion_protocol
  client.
version: 0.0.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  agent_runtime_protocol:
    path: ../agent_runtime_protocol
  clock: ^1.1.1
  completion_protocol:
    path: ../completion_protocol
  logic_blocks: ^1.0.0
  meta: ^1.15.0
  prompt_builder:
    path: ../prompt_builder
  tool_protocol:
    path: ../tool_protocol

dev_dependencies:
  coverage: ^1.9.0
  fake_async: ^1.3.1
  mocktail: ^1.0.4
  test: ^1.25.0
  very_good_analysis: ^10.0.0
