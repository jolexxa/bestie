name: sandbox_repository
description: >
  Bestie's sandbox lifecycle — provisions a process confinement once per policy and
  reuses it across commands, so the (on Windows, tree-walking) provisioning cost
  is paid once and can be warmed at bootstrap.
version: 0.0.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  clock: ^1.1.1
  intentions: ^0.1.0
  logic_blocks: ^1.0.0
  meta: ^1.18.0
  path: ^1.9.1
  process_host:
    path: ../../infra/process_host
  rxdart: ^0.28.0
  sandbox:
    path: ../../infra/sandbox
  sandbox_grant_store:
    path: ../../data/sandbox_grant_store
  sandbox_windows:
    path: ../../infra/sandbox_windows

dev_dependencies:
  file: ^7.0.1
  mocktail: ^1.0.5
  test: ^1.26.3
  very_good_analysis: ^10.0.0
