name: built_in_server_repository
description: >-
  The built-in inference server as a feature: starting and stopping it, how it
  loads models, and what it is doing right now.
version: 0.0.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  intentions: ^0.1.0
  local_server_protocol:
    path: ../../infra/local_server_protocol
  provider_local:
    path: ../../data/provider_local
  rxdart: ^0.28.0

dev_dependencies:
  coverage: ^1.15.0
  mocktail: ^1.0.4
  test: ^1.26.3
  very_good_analysis: ^10.0.0
