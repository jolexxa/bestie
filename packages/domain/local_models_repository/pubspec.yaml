name: local_models_repository
description: >-
  Bestie's local model library: GGUFs downloaded from Hugging Face and found in
  the user's folders, the downloads that bring them in, and the model index the
  inference server loads from.
version: 0.0.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  clock: ^1.1.1
  crypto: ^3.0.6
  file: ^7.0.1
  gguf_reader:
    path: ../../data/gguf_reader
  hugging_face_client:
    path: ../../data/hugging_face_client
  intentions: ^0.1.0
  llm_model_profiles:
    path: ../../infra/llm_model_profiles
  local_inference_protocol:
    path: ../../infra/local_inference_protocol
  logic_blocks: ^1.0.0
  model_downloader:
    path: ../../data/model_downloader
  model_index_store:
    path: ../../data/model_index_store
  path: ^1.9.1
  rxdart: ^0.28.0

dev_dependencies:
  coverage: ^1.15.0
  fake_async: ^1.3.2
  http: ^1.1.0
  mocktail: ^1.0.4
  test: ^1.26.3
  very_good_analysis: ^10.0.0
