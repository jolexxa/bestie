name: bestie_local_models_use_case
description: >-
  Local models in the palette: download GGUFs from Hugging Face, browse the
  installed library and the built-in server, and manage model folders.
version: 0.0.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  agent_repository:
    path: ../../domain/agent_repository
  built_in_server_client:
    path: ../../data/built_in_server_client
  built_in_server_repository:
    path: ../../domain/built_in_server_repository
  clock: ^1.1.1
  collection: ^1.19.0
  command_protocol:
    path: ../../infra/command_protocol
  config_protocol:
    path: ../../infra/config_protocol
  config_repository:
    path: ../../domain/config_repository
  intentions: ^0.1.0
  local_models_repository:
    path: ../../domain/local_models_repository
  local_server_protocol:
    path: ../../infra/local_server_protocol
  platform_repository:
    path: ../../domain/platform_repository
  process_host:
    path: ../../infra/process_host
  provider_protocol:
    path: ../../infra/provider_protocol
  provider_repository:
    path: ../../domain/provider_repository
  rxdart: ^0.28.0

dev_dependencies:
  agent_runtime_protocol:
    path: ../../infra/agent_runtime_protocol
  bestie_platform_abstractions:
    path: ../../data/bestie_platform_abstractions
  coverage: ^1.15.0
  fake_async: ^1.3.2
  mocktail: ^1.0.4
  test: ^1.26.3
  very_good_analysis: ^10.0.0
