name: LinuxPosixBindings
description: |
  POSIX (libc) + Linux bindings generated by ffigen against
  `/usr/include`. Regenerate via `dart run melos run ffigen_posix_linux`
  on a Linux host.

output: '../lib/src/bindings/linux_bindings.dart'

headers:
  entry-points:
    # POSIX surface
    - '/usr/include/spawn.h'
    - '/usr/include/stdlib.h'
    - '/usr/include/unistd.h'
    - '/usr/include/fcntl.h'
    - '/usr/include/termios.h'
    - '/usr/include/signal.h'
    - '/usr/include/string.h'
    - '/usr/include/sys/ioctl.h'
    - '/usr/include/sys/statvfs.h'
    - '/usr/include/sys/wait.h'
    # Linux-specific
    - '/usr/include/sys/sysinfo.h'

exclude-all-by-default: true

functions:
  include:
    # PTY allocation
    - posix_openpt
    - grantpt
    - unlockpt
    - ptsname
    # posix_spawn family
    - posix_spawnp
    - posix_spawn
    - posix_spawn_file_actions_init
    - posix_spawn_file_actions_destroy
    - posix_spawn_file_actions_adddup2
    - posix_spawn_file_actions_addclose
    - posix_spawnattr_init
    - posix_spawnattr_destroy
    # signals
    - kill
    # termios
    - tcgetattr
    - tcsetattr
    # ioctl (variadic — see variadic-arguments below)
    - ioctl
    # process / fd
    - waitpid
    - read
    - write
    - close
    - open
    - dup
    - dup2
    - pipe
    - chdir
    - fcntl
    - usleep
    # error formatting
    - strerror
    # filesystem
    - statvfs
    # Linux memory/cpu info
    - sysinfo
  rename:
    '_exit': 'exitImmediate'
  variadic-arguments:
    ioctl:
      - types: ['WinSize*']
        postfix: 'WinSize'
      - types: ['int']
        postfix: 'Int'
    open:
      - types: ['int']
        postfix: 'Mode'
    fcntl:
      - types: ['int']
        postfix: 'Int'

macros:
  include:
    # open / fcntl flags
    - O_RDWR
    - O_RDONLY
    - O_WRONLY
    - O_CREAT
    - O_APPEND
    - O_TRUNC
    - O_NOCTTY
    - O_NONBLOCK
    # fcntl commands and flags
    - F_GETFD
    - F_SETFD
    - F_GETFL
    - F_SETFL
    - FD_CLOEXEC
    # ioctl / tty
    - TIOCSWINSZ
    - TIOCGWINSZ
    - TIOCSCTTY
    # waitpid
    - WNOHANG
    # termios bits
    - ECHO
    - ECHOE
    - ECHOK
    - ECHOKE
    - ECHOCTL
    - PENDIN
    - ICANON
    - ISIG
    - IEXTEN
    - IXON
    - IXANY
    - ICRNL
    - INPCK
    - ISTRIP
    - IMAXBEL
    - BRKINT
    - IUTF8
    - OPOST
    - ONLCR
    - CREAD
    - CS8
    - HUPCL
    # special control chars (c_cc indices)
    - VEOF
    - VEOL
    - VEOL2
    - VERASE
    - VWERASE
    - VKILL
    - VREPRINT
    - VINTR
    - VQUIT
    - VSUSP
    - VSTART
    - VSTOP
    - VLNEXT
    - VDISCARD
    - VMIN
    - VTIME
    # baud rate
    - B38400
    # tcsetattr action
    - TCSANOW
    - TCSAFLUSH

structs:
  include:
    - winsize
    - termios
    - statvfs
    - sysinfo
    - sigaction
    - sched_param
  rename:
    'winsize': 'WinSize'
    # Disambiguate from same-named functions so ffigen doesn't mangle the
    # function symbols with `$1`.
    'statvfs': 'Statvfs'
    'sysinfo': 'SysInfo'
    # `_`-prefixed names are emitted private; un-prefix so sizes.dart can ref.
    '__sigset_t': 'sigset_t_struct'
  # Default is `opaque`; we need full layout for `sizeOf<T>()`.
  dependency-only: full

unions:
  include: []

enums:
  include: []

typedefs:
  include:
    - posix_spawnattr_t
    - posix_spawn_file_actions_t
    - sigset_t
    - __sigset_t

# Dart-loaded libclang doesn't auto-detect its resource dir on Linux; point
# ffigen at it so `<stddef.h>` and friends resolve. Bump the version path
# if your distro ships a different libclang.
compiler-opts:
  - '-I/usr/lib/clang/21/include'
  # `_XOPEN_SOURCE=700` exposes POSIX:2008/X-Open 7 functions like
  # `posix_openpt` without pulling in any GNU-specific extensions.
  - '-D_XOPEN_SOURCE=700'
  - '-D_DEFAULT_SOURCE'

ignore-source-errors: true

silence-enum-warning: true

preamble: |
  // ignore_for_file: non_constant_identifier_names
  // ignore_for_file: camel_case_types
  // ignore_for_file: public_member_api_docs
  // ignore_for_file: constant_identifier_names
  // ignore_for_file: unused_element
  // ignore_for_file: unused_field
  // ignore_for_file: unused_import
  // ignore_for_file: type=lint
  //
  // GENERATED by ffigen — do not edit by hand.
  // See tool/ffigen_linux.yaml to change what's generated.
