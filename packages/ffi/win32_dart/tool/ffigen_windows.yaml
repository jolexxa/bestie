name: WindowsBindings
description: |
  Win32 + CRT bindings for Windows x64, generated by ffigen.

  Regenerate via `dart run melos run ffigen_windows` after editing this
  config.

  PREREQUISITES on the regenerating host:
    * VS Build Tools with `Microsoft.VisualStudio.Component.VC.Tools.x86.x64`
      (supplies vcruntime.h / excpt.h, which the SDK headers include but do
      not ship) and `Microsoft.VisualStudio.Component.Windows11SDK.26100`.
    * LLVM at `C:\Program Files\LLVM` — ffigen's default libclang location,
      which is why no `llvm-path` appears below.

output: '../lib/src/bindings/windows_bindings.dart'

headers:
  entry-points:
    - 'win32_surface.h'

compiler-opts:
  # Target the MSVC ABI and let clang locate the SDK + MSVC headers. This
  # is what keeps the config machine-independent; without it clang would
  # need every include directory spelled out by version.
  - '--target=x86_64-pc-windows-msvc'
  # Windows 10 1809 / build 17763 is bestie's floor because that is where
  # ConPTY was introduced, and `CreatePseudoConsole` is gated on
  # NTDDI_VERSION (not _WIN32_WINNT) — 0x0A000006 is NTDDI_WIN10_RS5.
  # Declaring the floor here keeps the surface honest: anything needing a
  # later Windows simply will not appear.
  - '-D_WIN32_WINNT=0x0A00'
  - '-DNTDDI_VERSION=0x0A000006'

exclude-all-by-default: true

functions:
  include:
    # --- fd redirect (CRT) --------------------------------------------
    # No `_open`: it is variadic in `pmode`, which ffigen cannot express.
    # The log file is opened with CreateFileW and adopted via
    # _open_osfhandle instead — more idiomatic on Windows, and it makes the
    # sharing mode explicit rather than inherited from CRT defaults.
    - _open_osfhandle
    - _get_osfhandle
    - _close
    - _dup
    - _dup2
    - _read
    - _write
    - CreateFileW
    - _get_errno
    - strerror_s
    # --- std handles ---------------------------------------------------
    - GetStdHandle
    - SetStdHandle
    # --- native library search path -----------------------------------
    - SetDllDirectoryW
    # --- shell userland links -----------------------------------------
    - CreateHardLinkW
    # --- disk space gate ----------------------------------------------
    - GetDiskFreeSpaceExW
    # --- RAM / cores --------------------------------------------------
    - GlobalMemoryStatusEx
    - GetActiveProcessorCount
    # --- console mode (InputCapture) ----------------------------------
    - GetConsoleMode
    - SetConsoleMode
    # --- clipboard ----------------------------------------------------
    - OpenClipboard
    - CloseClipboard
    - EmptyClipboard
    - SetClipboardData
    - GetClipboardData
    - GlobalAlloc
    - GlobalFree
    - GlobalLock
    - GlobalUnlock
    # --- ConPTY + process ---------------------------------------------
    - CreatePipe
    - CloseHandle
    - ReadFile
    - WriteFile
    - CreatePseudoConsole
    - ResizePseudoConsole
    - ClosePseudoConsole
    - InitializeProcThreadAttributeList
    - UpdateProcThreadAttribute
    - DeleteProcThreadAttributeList
    - CreateProcessW
    - TerminateProcess
    - GetExitCodeProcess
    - WaitForSingleObject
    # --- AppContainer profile (userenv.dll) ---------------------------
    - CreateAppContainerProfile
    - DeriveAppContainerSidFromAppContainerName
    - DeleteAppContainerProfile
    - GetAppContainerFolderPath
    # --- COM allocator (ole32.dll) ------------------------------------
    # GetAppContainerFolderPath hands back a CoTaskMemAlloc'd string.
    - CoTaskMemFree
    # --- capability SIDs (kernelbase.dll) -----------------------------
    - DeriveCapabilitySidsFromName
    # --- SIDs and DACLs (advapi32.dll) --------------------------------
    - ConvertStringSidToSidW
    - ConvertSidToStringSidW
    - GetNamedSecurityInfoW
    - SetEntriesInAclW
    - GetExplicitEntriesFromAclW
    - SetNamedSecurityInfoW
    - FreeSid
    - LocalFree
    # --- error reporting ----------------------------------------------
    - GetLastError
    - FormatMessageW
    # --- elevation (shell32.dll) ----------------------------------------
    # The one-time sandbox initialization re-runs bestie elevated via the
    # `runas` verb; ShellExecuteExW is the only way to do that without a
    # console flashing.
    - ShellExecuteExW
  rename:
    # C tags carry a leading underscore, which Dart would make PRIVATE —
    # invisible to the adapter in the next file over. Strip it.
    '_(.*)': '$1'

structs:
  include:
    # Matched on the C *tag*, not the typedef. Dependency structs
    # (MEMORYSTATUSEX, COORD, STARTUPINFOW, ...) arrive automatically via
    # the functions above; STARTUPINFOEXW does not, because nothing in
    # our function list references it — we build it to pass the
    # pseudoconsole attribute list to CreateProcessW.
    - '_STARTUPINFOEXW'
    # SECURITY_CAPABILITIES is what PROC_THREAD_ATTRIBUTE_SECURITY_CAPABILITIES
    # points at; the rest are the DACL calls' parameter types. None arrive as
    # dependencies, because SetEntriesInAclW takes them by pointer.
    - '_SECURITY_CAPABILITIES'
    - '_SID_AND_ATTRIBUTES'
    - '_TRUSTEE_W'
    - '_EXPLICIT_ACCESS_W'
    # ShellExecuteExW takes its parameters by pointer to this.
    - '_SHELLEXECUTEINFOW'
  rename:
    '_(.*)': '$1'

unions:
  include: []
  rename:
    # ULARGE_INTEGER arrives as a dependency of GetDiskFreeSpaceExW. It is
    # a union, so the struct rename above does not reach it, and a private
    # name here would be unnameable from the adapter.
    '_(.*)': '$1'

enums:
  include:
    # The DACL calls take these as enums, not ints
    - SE_OBJECT_TYPE
    - ACCESS_MODE
    - TRUSTEE_FORM
    - TRUSTEE_TYPE
    - MULTIPLE_TRUSTEE_OPERATION
  rename:
    # Matched on the typedef, generated from the C tag — which carries the
    # leading underscore Dart would make private.
    '_(.*)': '$1'

macros:
  include:
    # CRT open flags for _open_osfhandle. These are Windows CRT constants
    # that happen to wear Unix spellings — `O_BINARY` has no POSIX
    # counterpart at all — so their presence here implies no POSIX
    # dependency.
    #
    # Deliberately the bare spellings, NOT the `_O_` ones: fcntl.h defines
    # `O_WRONLY` as an alias *for* `_O_WRONLY`, so the underscore-stripping
    # rename below would collide with a name that already exists — and
    # ffigen drops both, silently, with no diagnostic. These need no
    # rename.
    - O_RDONLY
    - O_WRONLY
    - O_RDWR
    - O_APPEND
    - O_TRUNC
    - O_BINARY
    # std handle ids
    - STD_INPUT_HANDLE
    - STD_OUTPUT_HANDLE
    - STD_ERROR_HANDLE
    # GetActiveProcessorCount
    - ALL_PROCESSOR_GROUPS
    # console mode bits — ENABLE_PROCESSED_INPUT is the one InputCapture
    # clears for both controlKeys and flowControl.
    - ENABLE_PROCESSED_INPUT
    - ENABLE_LINE_INPUT
    - ENABLE_ECHO_INPUT
    - ENABLE_VIRTUAL_TERMINAL_INPUT
    - ENABLE_VIRTUAL_TERMINAL_PROCESSING
    # CreateFileW
    - GENERIC_WRITE
    - FILE_SHARE_READ
    - FILE_SHARE_WRITE
    - CREATE_ALWAYS
    - OPEN_ALWAYS
    - FILE_ATTRIBUTE_NORMAL
    # clipboard
    - CF_UNICODETEXT
    - GMEM_MOVEABLE
    # process creation
    - EXTENDED_STARTUPINFO_PRESENT
    - CREATE_UNICODE_ENVIRONMENT
    - STARTF_USESTDHANDLES
    - INFINITE
    # Building blocks for PROC_THREAD_ATTRIBUTE_PSEUDOCONSOLE and
    # PROC_THREAD_ATTRIBUTE_HANDLE_LIST. The composites themselves are
    # *function-like* macros — `ProcThreadAttributeValue(22, FALSE, TRUE,
    # FALSE)` — which ffigen cannot evaluate, so `constants.dart` derives
    # them from these masks rather than hardcoding a magic number.
    - PROC_THREAD_ATTRIBUTE_NUMBER
    - PROC_THREAD_ATTRIBUTE_THREAD
    - PROC_THREAD_ATTRIBUTE_INPUT
    - PROC_THREAD_ATTRIBUTE_ADDITIVE
    # FormatMessageW
    - FORMAT_MESSAGE_FROM_SYSTEM
    - FORMAT_MESSAGE_IGNORE_INSERTS
    # DACL rights and inheritance. A package SID is grant-only — its DENY
    # ACEs are ignored — so a carve-out is expressed by not granting.
    - DACL_SECURITY_INFORMATION
    - GENERIC_READ
    - GENERIC_EXECUTE
    - GENERIC_ALL
    - OBJECT_INHERIT_ACE
    - CONTAINER_INHERIT_ACE
    - SUB_CONTAINERS_AND_OBJECTS_INHERIT
    - NO_INHERITANCE
    - FILE_LIST_DIRECTORY
    - FILE_TRAVERSE
    - SYNCHRONIZE
    # Set on an ACE that flowed down from a parent; an inspection of what
    # was granted *here* skips those.
    - INHERITED_ACE
    # ShellExecuteExW: keep the process handle to wait on, run it hidden,
    # and the error the user declining the UAC prompt comes back as.
    - SEE_MASK_NOCLOSEPROCESS
    - SW_HIDE
    - ERROR_CANCELLED
    # AppContainer capability SIDs are handed to CreateProcessW enabled.
    - SE_GROUP_ENABLED
    - ERROR_ALREADY_EXISTS
  rename:
    '_(.*)': '$1'

typedefs:
  include:
    - HANDLE
    - HPCON

# No `ignore-source-errors` on purpose. The SDK headers parse clean, so a
# fatal error here is a real problem and should stop the build rather than
# be suppressed into a half-written binding.

silence-enum-warning: true

preamble: |
  // ignore_for_file: non_constant_identifier_names
  // ignore_for_file: camel_case_types
  // ignore_for_file: public_member_api_docs
  // ignore_for_file: constant_identifier_names
  // ignore_for_file: unused_element
  // ignore_for_file: unused_field
  // ignore_for_file: unused_import
  // ignore_for_file: type=lint
  //
  // GENERATED by ffigen — do not edit by hand.
  // See tool/ffigen_windows.yaml to change what's generated.
