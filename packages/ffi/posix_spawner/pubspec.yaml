name: posix_spawner
description: >-
  bestie's PTY supervisor: the `spawner` Rust bootstrap helper plus the
  Dart driver that speaks its status-pipe protocol. Sits on top of
  posix_dart's raw libc bindings; keeps the spawn machinery out of the
  pure-bindings package.
version: 0.0.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  ffi: ^2.1.0
  meta: ^1.16.0
  posix_dart:
    path: ../posix_dart

dev_dependencies:
  mocktail: ^1.0.4
  test: ^1.26.3
  very_good_analysis: ^10.0.0
