name: inference_openai_compat
description: >-
  An inference_protocol client for OpenAI-compatible chat completion servers,
  built on openai_dart.
version: 0.0.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  http: ^1.1.0
  inference_protocol:
    path: ../../infra/inference_protocol
  intentions: ^0.1.0
  meta: ^1.15.0
  openai_dart: ^8.1.0

dev_dependencies:
  coverage: ^1.9.0
  mocktail: ^1.0.4
  test: ^1.25.0
  very_good_analysis: ^10.0.0
