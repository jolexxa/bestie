name: model_catalog_modelsdev
description: >-
  The models.dev open model catalog as a bestie model catalog, fetched on
  demand and cached on disk.
version: 0.0.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  clock: ^1.1.1
  file: ^7.0.0
  http: ^1.1.0
  inference_protocol:
    path: ../../infra/inference_protocol
  intentions: ^0.1.0
  provider_protocol:
    path: ../../infra/provider_protocol

dev_dependencies:
  coverage: ^1.9.0
  test: ^1.25.0
  very_good_analysis: ^10.0.0
