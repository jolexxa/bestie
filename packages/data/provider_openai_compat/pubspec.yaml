name: provider_openai_compat
description: >-
  A hosted provider for bestie made of nothing but an OpenAI-compatible
  endpoint: Fireworks AI, a local llama.cpp server, or any custom URL.
version: 0.0.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  http: ^1.1.0
  inference_protocol:
    path: ../../infra/inference_protocol
  intentions: ^0.1.0
  provider_protocol:
    path: ../../infra/provider_protocol

dev_dependencies:
  coverage: ^1.9.0
  test: ^1.25.0
  very_good_analysis: ^10.0.0
