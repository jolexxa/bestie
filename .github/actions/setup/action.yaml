name: 🛠 Setup
description: >
  Bootstrap a fresh checkout for the host platform: Dart workspace
  dependencies, downloaded native assets, and Rust sidecars. Mirrors `dart run melos run setup` step for step.

inputs:
  os:
    description: "Asset OS for tool/ scripts (macos, linux, windows)"
    required: true

runs:
  using: composite
  steps:
    - name: 💽 Setup Dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable
        problem-matcher: false

    - name: 🔑 Compute asset cache keys
      id: keys
      shell: bash
      run: |
        echo "curl=$(git rev-parse HEAD:packages/ffi/curl_impersonate_dart/third_party/curl-impersonate)" >> "$GITHUB_OUTPUT"
        echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

    - name: 💾 Cache curl-impersonate assets
      id: curl-cache
      uses: actions/cache@v6
      with:
        path: packages/ffi/curl_impersonate_dart/assets/native
        key: curl-${{ inputs.os }}-${{ steps.keys.outputs.curl }}

    - name: 💾 Cache llama.cpp libraries
      id: llama-cache
      uses: actions/cache@v6
      with:
        path: packages/ffi/llama_cpp_dart/assets/native
        key: llama-${{ inputs.os }}-${{ hashFiles('packages/ffi/llama_cpp_dart/llama_release.txt') }}

    - name: 💾 Cache CA certificate bundle
      id: cert-cache
      uses: actions/cache@v6
      with:
        path: packages/ffi/curl_impersonate_dart/assets/cacert.pem
        key: cacert-${{ steps.keys.outputs.month }}

    - name: 💾 Cache the Windows console host
      id: console-cache
      if: inputs.os == 'windows'
      uses: actions/cache@v6
      with:
        path: packages/ffi/win32_dart/assets/native/windows
        key: openconsole-${{ hashFiles('tool/src/console_host.dart') }}

    - name: 🏷 Fetch curl-impersonate tags
      if: steps.curl-cache.outputs.cache-hit != 'true'
      shell: bash
      run: git -C packages/ffi/curl_impersonate_dart/third_party/curl-impersonate fetch --tags

    - name: 📦 Install dependencies
      shell: bash
      run: dart pub get

    - name: ⬇️ Download curl-impersonate assets
      if: steps.curl-cache.outputs.cache-hit != 'true'
      shell: bash
      run: dart tool/download_curl_assets.dart --os ${{ inputs.os }}

    - name: ⬇️ Download llama.cpp libraries
      if: steps.llama-cache.outputs.cache-hit != 'true'
      shell: bash
      run: dart tool/download_llama_assets.dart --os ${{ inputs.os }}

    - name: ⬇️ Download CA certificate bundle
      if: steps.cert-cache.outputs.cache-hit != 'true'
      shell: bash
      run: dart tool/download_cert_assets.dart

    - name: ⬇️ Download the Windows console host
      if: inputs.os == 'windows' && steps.console-cache.outputs.cache-hit != 'true'
      shell: bash
      run: dart tool/download_openconsole_assets.dart

    - name: 🦀 Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: 💾 Cache cargo builds
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          packages/infra/bestie_edit/bestie_edit -> ../../../../build/cargo-target
          packages/ffi/posix_spawner/bestie_guard -> ../../../../build/cargo-target
          packages/ffi/posix_spawner/spawner -> ../../../../build/cargo-target
        cache-targets: true

    - name: 🔨 Build spawner
      if: inputs.os != 'windows'
      shell: bash
      run: dart tool/build_spawner.dart

    - name: 🔨 Build Rust sidecars
      shell: bash
      run: dart tool/build_sidecar.dart --all
